<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${action}</title>
</head>
<body style="margin:0;background:#f6f8fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;color:#1f2937;line-height:1.7;padding:28px 14px;">
<div style="max-width:620px;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(15,23,42,.08);">
  <div style="background:#166534;color:#fff;padding:24px 30px;">
    <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.82;">Account Notice</div>
    <h1 style="margin:6px 0 0;font-size:22px;line-height:1.3;">${action}</h1>
  </div>
  <div style="padding:28px 30px;">
    <div style="background:#f0fdf4;border-left:4px solid #16a34a;border-radius:8px;padding:16px 18px;margin-bottom:20px;">
      <p style="margin:0;color:#166534;">用户 <strong>${username}</strong> 的账户状态已更新，请留意以下操作详情。</p>
    </div>
    <table style="width:100%;border-collapse:collapse;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;">
      <tr><td style="width:120px;background:#f9fafb;color:#64748b;padding:12px;">用户</td><td style="padding:12px;font-weight:600;">${username}</td></tr>
      <tr><td style="background:#f9fafb;color:#64748b;padding:12px;">原因</td><td style="padding:12px;">${reason}</td></tr>
      <tr><td style="background:#f9fafb;color:#64748b;padding:12px;">到期</td><td style="padding:12px;">${expiry_date}</td></tr>
      <tr><td style="background:#f9fafb;color:#64748b;padding:12px;">操作人</td><td style="padding:12px;">${operator}</td></tr>
      <tr><td style="background:#f9fafb;color:#64748b;padding:12px;">状态</td><td style="padding:12px;">${status}</td></tr>
      <tr><td style="background:#f9fafb;color:#64748b;padding:12px;">时间</td><td style="padding:12px;">${timestamp}</td></tr>
    </table>
  </div>
  <div style="padding:16px 30px;background:#f9fafb;border-top:1px solid #e5e7eb;color:#94a3b8;font-size:12px;">用户管理系统 · 自动通知，请勿回复</div>
</div>
</body>
</html>
