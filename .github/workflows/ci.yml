name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            case "$file" in
              Miniforge.sh|data/*|logs/*|templates/*) continue ;;
            esac
            shellcheck --severity=error "$file"
            checked=$((checked + 1))
          done < <(git ls-files -z -- '*.sh')
          echo "ShellCheck scanned $checked script(s)."

  rust-backend:
    name: Rust Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/backend -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  web-frontend:
    name: Web Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck rsnapshot ufw htop
          # Mock commands for testing
          sudo ln -sf /bin/true /usr/local/bin/setquota
          sudo ln -sf /bin/true /usr/local/bin/repquota
      
      - name: Run Regression Suite
        run: |
          chmod +x tests/*.sh
          bash tests/run_regression.sh --level all
      
      - name: Validate Shell Syntax
        run: |
          set -o pipefail
          git ls-files -z -- '*.sh' |
            while IFS= read -r -d '' file; do
              [[ "$file" == 'Miniforge.sh' ]] && continue
              bash -n "$file" || exit 1
            done

  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check required documentation exists
        run: |
          required_docs=(README.md docs/DEEPWIKI.md)
          for doc in "${required_docs[@]}"; do
            test -f "$doc" || {
              echo "Error: missing required documentation file: $doc"
              exit 1
            }
          done

      - name: Check README sections
        run: |
          grep -Eq "Quick Start|快速开始" README.md || echo "Warning: README missing Quick Start section"
          # 项目已明确移除“安装/Installation”口径，不再要求该章节；
          # 若未来重新出现安装描述，则给出提示以便确认。
          if grep -Eiq "Installation|安装" README.md; then
            echo "Warning: README still mentions Installation; confirm it is intentional"
          fi
          grep -Eq "Documentation|文档" README.md || echo "Warning: README missing Documentation section"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for sensitive files
        run: |
          bash scripts/check_sensitive_files.sh .

      - name: Web backend security gate (no privilege / no system-write / no shell)
        # plan.md 14.1-14.3：阻断式门禁。web/backend/src 里禁止出现提权/系统管理命令/任意进程派生。
        run: |
          # 无 web 源码时（目录缺失）视为跳过，退出码 2。
          bash scripts/check_web_security.sh web/backend/src
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          echo "web security gate rc=$rc"
      
      - name: Check file permissions
        run: |
          # Ensure scripts are executable
          for file in *.sh lib/*.sh scripts/*.sh; do
            if [[ -f "$file" ]] && [[ ! -x "$file" ]]; then
              echo "Warning: $file is not executable"
            fi
          done

  # NOTE: shfmt 格式检查已从提示模式收紧为阻断模式。
  # 仓库已按 shfmt v3.12.0 默认格式完成全量格式化。
  format:
    name: Format Check (shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          # 固定 v3.12.0，与本地格式化及 pre-commit 配置版本对齐。
          # ubuntu-latest runner 预装 Go，go install 为安装路径。
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Check shell formatting (shfmt -d)
        run: |
          set -o pipefail
          command -v shfmt >/dev/null || { echo "::error::shfmt not installed"; exit 2; }
          shfmt --version
          checked=0
          unclean=0
          # 与语法检查 job 一致的遍历方式：NUL 安全 + 跳过 Miniforge.sh
          while IFS= read -r -d '' file; do
            [[ "$file" == 'Miniforge.sh' ]] && continue
            checked=$((checked + 1))
            if ! shfmt -d "$file"; then
              echo "::warning::shfmt: $file needs formatting"
              unclean=$((unclean + 1))
            fi
          done < <(git ls-files -z -- '*.sh')
          # 收紧路径：continue-on-error: false 时此处 exit 1 真正阻断 CI
          if [ "$unclean" -gt 0 ]; then
            echo "::error::shfmt: $unclean file(s) need formatting"
            exit 1
          fi
          echo "== shfmt -d summary: checked=$checked, needs-format=$unclean =="
