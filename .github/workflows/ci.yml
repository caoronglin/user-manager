name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            # `.validation/` 是消融实验的 scratch + 证据树（内含**故意删掉守卫**的源码副本
            # 与无 shebang 的探针脚本），不是交付代码。与 data/ logs/ templates/ 同理排除。
            case "$file" in
              Miniforge.sh|data/*|logs/*|templates/*|.validation/*) continue ;;
            esac
            shellcheck --severity=error "$file"
            checked=$((checked + 1))
          done < <(git ls-files -z -- '*.sh')
          echo "ShellCheck scanned $checked script(s)."

  rust-backend:
    name: Rust Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/backend -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  web-frontend:
    name: Web Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck rsnapshot ufw htop
          # Mock commands for testing
          sudo ln -sf /bin/true /usr/local/bin/setquota
          sudo ln -sf /bin/true /usr/local/bin/repquota
      
      - name: Run Regression Suite
        run: |
          chmod +x tests/*.sh
          bash tests/run_regression.sh --level all
      
      - name: Validate Shell Syntax
        run: |
          set -o pipefail
          git ls-files -z -- '*.sh' |
            while IFS= read -r -d '' file; do
              [[ "$file" == 'Miniforge.sh' ]] && continue
              # `.validation/` = 消融实验 scratch/证据树，含故意删守卫的副本，不参与语法检查
              [[ "$file" == .validation/* ]] && continue
              bash -n "$file" || exit 1
            done

  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check required documentation exists
        run: |
          required_docs=(README.md docs/DEEPWIKI.md)
          for doc in "${required_docs[@]}"; do
            test -f "$doc" || {
              echo "Error: missing required documentation file: $doc"
              exit 1
            }
          done

      - name: Check README sections
        run: |
          # 章节存在性是不可协商的不变量，改为阻断式：只 Warning 的检查永远不可能
          # 让 CI 变红，等于没有门禁（与 a4762a5 收紧权限检查同理）。
          # 安装口径那一条**故意保留为 Warning**：它是留给人的确认提示，不是机器可判定的断言。
          if ! grep -Eq "Quick Start|快速开始" README.md; then
            echo "::error::README 缺少 Quick Start / 快速开始章节"
            exit 1
          fi
          # 项目已明确移除“安装/Installation”口径，不再要求该章节；
          # 若未来重新出现安装描述，则给出提示以便确认。
          if grep -Eiq "Installation|安装" README.md; then
            echo "Warning: README still mentions Installation; confirm it is intentional"
          fi
          if ! grep -Eq "Documentation|文档" README.md; then
            echo "::error::README 缺少 Documentation / 文档章节"
            exit 1
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for sensitive files
        run: |
          bash scripts/check_sensitive_files.sh .

      - name: Web backend security gate (no privilege / no system-write / no shell)
        # plan.md 14.1-14.3：阻断式门禁。web/backend/src 里禁止出现提权/系统管理命令/任意进程派生。
        run: |
          # 无 web 源码时（目录缺失）视为跳过，退出码 2。
          #
          # 注意执行方式：GitHub Actions 的 run 默认跑 `bash -e`，脚本非零退出会**先**
          # 被 -e 中止，直接跟一句 `rc=$?` 是死代码，rc=2 的「跳过」分支永远不可达
          # （实测：`bash -e -c 'bash t.sh; rc=$?'` 在 t.sh exit 2 时不打印后续行）。
          # 把执行放进 if 条件里，条件上下文的失败不触发 -e，两种语义才能同时保留。
          if bash scripts/check_web_security.sh web/backend/src; then
            rc=0
          else
            rc=$?
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          echo "web security gate rc=$rc"
      
      - name: Check file permissions
        run: |
          # 阻断式门禁：入口脚本在 Git 索引中必须是 100755。
          # 背景：scripts/ 下 16 个入口曾丢失可执行位（索引 mode 为 100644），
          # 造成 4 个套件 18 个子测试失败；但本步骤原先只 echo Warning、不阻断，
          # 缺陷因此长期潜伏。Warning 不具备门禁能力，这里收紧为 exit 1。
          #
          # 范围与判据：
          #   - 遍历方式与本 job 语法检查、format job 的 shfmt 保持一致：
          #     git ls-files -z + 跳过 Miniforge.sh（NUL 安全，不受路径空格影响）
          #   - 只对入口脚本要求执行位：根目录 *.sh 与 scripts/*.sh
          #   - lib/*.sh 是被 source 的库，设计上就是 644，不纳入本检查
          #   - 判定直接读 Git 索引 mode，而不是 [[ -x ]]：
          #     索引才是 checkout 后权限的唯一来源，且不受 umask/ACL/core.fileMode 影响，
          #     能精准捕获“本地可执行但索引 100644、CI 上不可执行”的真实故障模式
          set -uo pipefail
          checked=0
          missing=0
          while IFS=$'\t' read -r -d '' meta path; do
            [[ "$path" == 'Miniforge.sh' ]] && continue
            # 入口脚本 = scripts/*.sh，或根目录的 *.sh（路径中不含 /）
            case "$path" in
            scripts/*.sh) ;;
            */*) continue ;;
            *.sh) ;;
            *) continue ;;
            esac
            mode="${meta%% *}"
            checked=$((checked + 1))
            if [[ "$mode" != "100755" ]]; then
              echo "::error::入口脚本缺少可执行位（索引 mode $mode）: $path"
              missing=$((missing + 1))
            fi
          done < <(git ls-files -s -z -- '*.sh')
          # 遍历结果为空说明门禁本身失效（模式写错/仓库结构变化），必须报错而不是静默放过
          if [[ "$checked" -eq 0 ]]; then
            echo "::error::未匹配到任何入口脚本，权限门禁失效"
            exit 1
          fi
          if [[ "$missing" -gt 0 ]]; then
            echo "::error::$missing/$checked 个入口脚本在 Git 索引中不是 100755"
            echo "修复方式: git update-index --chmod=+x <file>  然后提交该 mode 变更"
            exit 1
          fi
          echo "== 权限门禁 summary: checked=$checked, missing=$missing =="

  # NOTE: shfmt 格式检查已从提示模式收紧为阻断模式。
  # 仓库已按 shfmt v3.12.0 默认格式完成全量格式化。
  format:
    name: Format Check (shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          # 固定 v3.12.0，与本地格式化及 pre-commit 配置版本对齐。
          # ubuntu-latest runner 预装 Go，go install 为安装路径。
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Check shell formatting (shfmt -d)
        run: |
          set -o pipefail
          command -v shfmt >/dev/null || { echo "::error::shfmt not installed"; exit 2; }
          shfmt --version
          checked=0
          unclean=0
          # 与语法检查 job 一致的遍历方式：NUL 安全 + 跳过 Miniforge.sh
          # `.validation/` 是消融实验的 scratch + 证据树（含故意删守卫的源码副本），
          # 其格式不归本 job 管，与 data/ logs/ templates/ 同理排除。
          while IFS= read -r -d '' file; do
            case "$file" in
              Miniforge.sh|.validation/*) continue ;;
            esac
            checked=$((checked + 1))
            if ! shfmt -d "$file"; then
              echo "::warning::shfmt: $file needs formatting"
              unclean=$((unclean + 1))
            fi
          done < <(git ls-files -z -- '*.sh')
          # 收紧路径：continue-on-error: false 时此处 exit 1 真正阻断 CI
          if [ "$unclean" -gt 0 ]; then
            echo "::error::shfmt: $unclean file(s) need formatting"
            exit 1
          fi
          echo "== shfmt -d summary: checked=$checked, needs-format=$unclean =="
