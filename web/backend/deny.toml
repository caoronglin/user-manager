# cargo-deny 配置（plan.md P1 质量门禁：cargo deny check）
# 仅显式覆盖 license 允许列表；其余（advisories/bans/sources）使用 cargo-deny 默认
# （默认即：deny 漏洞、deny 未知来源、warn 多版本）。
[licenses]
# 默认拒绝未列出的 license；显式允许常见宽松/弱 copyleft 许可证。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "NCSA",
]
confidence-threshold = 0.8
